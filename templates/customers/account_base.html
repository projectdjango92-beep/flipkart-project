{% extends "base.html" %}
{% block content %}<div class="main-container py-4"><div class="row g-3"><aside class="col-lg-3"><nav class="data-card p-3 sticky-lg-top" style="top:1rem"><h5>My Account</h5><a class="d-block p-2 {% if active_account_page == 'profile' %}fw-bold{% endif %}" href="{% url 'account_profile' %}">My Profile</a><a class="d-block p-2 {% if active_account_page == 'orders' %}fw-bold{% endif %}" href="{% url 'account_orders' %}">My Orders</a><a class="d-block p-2 {% if active_account_page == 'wishlist' %}fw-bold{% endif %}" href="{% url 'account_wishlist' %}">My Wishlist</a><a class="d-block p-2 {% if active_account_page == 'addresses' %}fw-bold{% endif %}" href="{% url 'account_addresses' %}">My Addresses</a><a class="d-block p-2 {% if active_account_page == 'location' %}fw-bold{% endif %}" href="{% url 'account_location' %}">Delivery Location</a><a class="d-block p-2 {% if active_account_page == 'coupons' %}fw-bold{% endif %}" href="{% url 'account_coupons' %}">Coupons & Offers</a><a class="d-block p-2 {% if active_account_page == 'settings' %}fw-bold{% endif %}" href="{% url 'account_settings' %}">Account Settings</a><hr><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-danger w-100">Log out</button></form></nav></aside><main class="col-lg-9">{% block account_content %}{% endblock %}</main></div></div>{% endblock %}
